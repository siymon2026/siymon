<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Links</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
*{
  font-family:'Tajawal',sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:#0a0a14;
  color:white;
  overflow-x:hidden;
}

.glow-circle{
  position:absolute;
  border-radius:50%;
  filter:blur(80px);
  opacity:.3;
}

.glass-btn{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(10px);
  transition:.3s;
}

.glass-btn:hover{
  background:rgba(255,140,0,.15);
  border-color:rgba(255,140,0,.5);
  transform:translateY(-3px);
}

.profile-img-container{
  width:120px;
  height:120px;
  border-radius:50%;
  overflow:hidden;
  border:3px solid orange;
}

.profile-img-container img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.admin-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  z-index:999;
  display:none;
  justify-content:center;
  align-items:center;
}

.admin-overlay.active{
  display:flex;
}

.admin-panel{
  width:90%;
  max-width:420px;
  max-height:90vh;
  overflow:auto;
  background:#111827;
  border-radius:20px;
  padding:20px;
}

.input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #333;
  background:#00000066;
  color:white;
  margin-bottom:12px;
}

.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:orange;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.btn2{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #555;
  background:transparent;
  color:white;
  margin-top:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="glow-circle" style="width:300px;height:300px;background:#ff8c00;top:10%;left:-5%;"></div>
<div class="glow-circle" style="width:250px;height:250px;background:#ff4500;bottom:10%;right:-5%;"></div>

<div class="relative z-10 flex flex-col items-center px-4 py-12 min-h-full">

<div class="profile-img-container">
<img id="profileImg" src="https://via.placeholder.com/300">
</div>

<h1 id="titleEl" class="text-3xl font-bold mt-6 text-orange-400">
اسمك هنا
</h1>

<p id="subtitleEl" class="text-gray-400 mt-2">
مرحبا بكم في صفحتي
</p>

<div class="w-full max-w-md mt-8 space-y-4">

<a id="link-instagram" href="#" class="glass-btn flex items-center gap-4 px-6 py-4 rounded-2xl w-full">
Instagram
</a>

<a id="link-facebook" href="#" class="glass-btn flex items-center gap-4 px-6 py-4 rounded-2xl w-full">
Facebook
</a>

<a id="link-tiktok" href="#" class="glass-btn flex items-center gap-4 px-6 py-4 rounded-2xl w-full">
TikTok
</a>

<a id="link-youtube" href="#" class="glass-btn flex items-center gap-4 px-6 py-4 rounded-2xl w-full">
YouTube
</a>

<a id="link-playstore" href="#" class="glass-btn flex items-center gap-4 px-6 py-4 rounded-2xl w-full">
Google Play
</a>

<a id="link-appstore" href="#" class="glass-btn flex items-center gap-4 px-6 py-4 rounded-2xl w-full">
App Store
</a>

<a id="link-website" href="#" class="glass-btn flex items-center gap-4 px-6 py-4 rounded-2xl w-full">
موقعي
</a>

</div>

<p id="adminTrigger" class="mt-10 text-gray-600 cursor-pointer">
© 2026
</p>

</div>

<div class="admin-overlay" id="adminOverlay">
<div class="admin-panel">

<div id="adminLogin">
<h2 class="text-2xl text-orange-400 font-bold mb-4 text-center">
لوحة المشرف
</h2>

<input type="password" id="adminPass" class="input" placeholder="الرقم السري">

<button onclick="checkAdmin()" class="btn">
دخول
</button>

<button onclick="closeAdmin()" class="btn2">
إغلاق
</button>
</div>

<div id="adminDashboard" style="display:none;">

<h2 class="text-2xl text-orange-400 font-bold mb-4 text-center">
إدارة الصفحة
</h2>

<label>صورة البروفايل</label>
<input type="file" id="profileUpload" class="input">

<label>صورة الخلفية</label>
<input type="file" id="bgUpload" class="input">

<input type="text" id="adminName" class="input" placeholder="الاسم">

<input type="text" id="adminDesc" class="input" placeholder="الوصف">

<input type="url" id="adminInsta" class="input" placeholder="Instagram URL">

<input type="url" id="adminFb" class="input" placeholder="Facebook URL">

<input type="url" id="adminTiktok" class="input" placeholder="TikTok URL">

<input type="url" id="adminYt" class="input" placeholder="YouTube URL">

<input type="url" id="adminPlay" class="input" placeholder="Google Play URL">

<input type="url" id="adminApple" class="input" placeholder="App Store URL">

<input type="url" id="adminWeb" class="input" placeholder="Website URL">

<input type="password" id="adminNewPass" class="input" placeholder="رقم سري جديد">

<button onclick="saveAdmin()" class="btn">
حفظ
</button>

<button onclick="closeAdmin()" class="btn2">
إغلاق
</button>

</div>

</div>
</div>

<script>

const GITHUB_USERNAME =siymon2026;
const GITHUB_REPOSITORY =siymon;
const GITHUB_TOKEN =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;

function loadData(){
return JSON.parse(localStorage.getItem('landing_data') || '{}');
}

function saveData(data){
localStorage.setItem('landing_data', JSON.stringify(data));
}

function initPage(){
const data = loadData();

if(data.name)
document.getElementById('titleEl').textContent = data.name;

if(data.desc)
document.getElementById('subtitleEl').textContent = data.desc;

if(data.instagram)
document.getElementById('link-instagram').href = data.instagram;

if(data.facebook)
document.getElementById('link-facebook').href = data.facebook;

if(data.tiktok)
document.getElementById('link-tiktok').href = data.tiktok;

if(data.youtube)
document.getElementById('link-youtube').href = data.youtube;

if(data.playstore)
document.getElementById('link-playstore').href = data.playstore;

if(data.appstore)
document.getElementById('link-appstore').href = data.appstore;

if(data.website)
document.getElementById('link-website').href = data.website;

if(data.profileImg){
  document.getElementById('profileImg').src = data.profileImg;
}

if(data.bgImg){
  document.body.style.backgroundImage = `url(${data.bgImg})`;
  document.body.style.backgroundSize = 'cover';
  document.body.style.backgroundPosition = 'center';
}
}

async function toBase64(file){
return new Promise((resolve,reject)=>{
const reader = new FileReader();
reader.readAsDataURL(file);
reader.onload = ()=> resolve(reader.result);
reader.onerror = error => reject(error);
});
}

async function uploadToGitHub(file){

const fileName = Date.now() + '_' + file.name;

const path = 'uploads/' + fileName;

const content = await toBase64(file);

const response = await fetch(
`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPOSITORY}/contents/${path}`,
{
method:'PUT',
headers:{
'Authorization': `token ${GITHUB_TOKEN}`,
'Content-Type':'application/json'
},
body: JSON.stringify({
message:'upload image',
content: content.split(',')[1]
})
}
);

const data = await response.json();

return data.content.download_url;
}

let tapCount = 0;
let tapTimer;

adminTrigger.addEventListener('click',()=>{

 tapCount++;

 clearTimeout(tapTimer);

 tapTimer = setTimeout(()=>{
 tapCount = 0;
 },800);

 if(tapCount >= 3){
  tapCount = 0;
  adminOverlay.classList.add('active');
 }

});

function checkAdmin(){

const data = loadData();

const pass = data.password || '1234';

if(document.getElementById('adminPass').value === pass){

 document.getElementById('adminLogin').style.display='none';
 document.getElementById('adminDashboard').style.display='block';

 document.getElementById('adminName').value = data.name || '';
 document.getElementById('adminDesc').value = data.desc || '';
 document.getElementById('adminInsta').value = data.instagram || '';
 document.getElementById('adminFb').value = data.facebook || '';
 document.getElementById('adminTiktok').value = data.tiktok || '';
 document.getElementById('adminYt').value = data.youtube || '';
 document.getElementById('adminPlay').value = data.playstore || '';
 document.getElementById('adminApple').value = data.appstore || '';
 document.getElementById('adminWeb').value = data.website || '';

}else{
alert('رقم سري خاطئ');
}
}

function closeAdmin(){
adminOverlay.classList.remove('active');
document.getElementById('adminLogin').style.display='block';
document.getElementById('adminDashboard').style.display='none';
}

function saveAdmin(){

const data = loadData();

data.name = document.getElementById('adminName').value;
data.desc = document.getElementById('adminDesc').value;
data.instagram = document.getElementById('adminInsta').value;
data.facebook = document.getElementById('adminFb').value;
data.tiktok = document.getElementById('adminTiktok').value;
data.youtube = document.getElementById('adminYt').value;
data.playstore = document.getElementById('adminPlay').value;
data.appstore = document.getElementById('adminApple').value;
data.website = document.getElementById('adminWeb').value;

const newPass = document.getElementById('adminNewPass').value;

if(newPass){
data.password = newPass;
}

saveData(data);
initPage();
closeAdmin();

alert('تم الحفظ');
}

profileUpload.addEventListener('change', async function(e){

const file = e.target.files[0];

if(!file) return;

alert('جاري رفع الصورة إلى GitHub...');

const imageUrl = await uploadToGitHub(file);

const data = loadData();

data.profileImg = imageUrl;

saveData(data);

profileImg.src = imageUrl;

alert('تم رفع الصورة');

});

bgUpload.addEventListener('change', async function(e){

const file = e.target.files[0];

if(!file) return;

alert('جاري رفع الخلفية إلى GitHub...');

const imageUrl = await uploadToGitHub(file);

const data = loadData();

data.bgImg = imageUrl;

saveData(data);

body.style.backgroundImage = `url(${imageUrl})`;
body.style.backgroundSize = 'cover';
body.style.backgroundPosition = 'center';

alert('تم رفع الخلفية');

});

initPage();

</script>

</body>
</html>
